<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- CSP propia de esta página (a diferencia de index.html, esta SÍ necesita
     ejecutar un script propio para detectar el sistema operativo y
     redirigir -- por eso script-src no es 'none' acá). No hay ningún script
     de terceros ni formulario, así que el resto queda tan cerrado como el
     resto del sitio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://bfgunqehpbkvjdwsfxfa.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
<meta name="theme-color" content="#0E1E42" />
<title>Descargar PlayR</title>
<meta name="description" content="Un solo enlace para descargar PlayR: te lleva directo a la App Store o a Google Play según tu celular." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #004D95;
    --secondary: #A5004A;
    --primary-dark: #0E1E42;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 55%, var(--secondary) 130%);
    text-align: center;
  }
  .card { max-width: 380px; }
  .logo { width: 150px; margin-bottom: 28px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 22px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; margin: 0 0 8px; text-wrap: balance; }
  p.sub { font-size: 14px; color: rgba(255,255,255,0.75); margin: 0 0 28px; line-height: 1.5; }
  .badges { display: flex; flex-direction: column; gap: 10px; }
  .badge {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: var(--primary-dark);
    border-radius: 12px; padding: 12px 20px;
    font-size: 15px; font-weight: 700;
    text-decoration: none;
  }
  .badge svg { width: 20px; height: 20px; flex-shrink: 0; }
  .gp-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    clip-path: polygon(0 0, 0 100%, 100% 50%);
    background: conic-gradient(from 0deg at 12% 50%,
      #34A853 0deg 70deg, #FBBC05 70deg 150deg, #EA4335 150deg 230deg, #4285F4 230deg 360deg);
  }
  /* Antes de que el script decida, no se sabe si hace falta el respaldo
     manual -- se muestra oculto y solo aparece si el redirect automático no
     ocurrió (JS bloqueado, o un navegador de escritorio que no aplica). */
  .fallback { display: none; }
  .fallback.show { display: flex; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://bfgunqehpbkvjdwsfxfa.supabase.co/storage/v1/object/public/app-assets/wordmark-mark-white.png" alt="PlayR" />
    <div class="spinner" role="status" aria-label="Redirigiendo"></div>
    <h1>Te estamos llevando a tu tienda de apps…</h1>
    <p class="sub">Si no pasa nada en unos segundos, elige tu opción abajo.</p>
    <p id="debug" style="font-size:10px;color:rgba(255,255,255,0.5);word-break:break-all;"></p>
    <div class="badges fallback" id="fallback">
      <a class="badge" href="https://apps.apple.com/co/app/playr/id6807193893">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Descargar en App Store
      </a>
      <a class="badge" href="https://play.google.com/store/apps/details?id=com.laruedev.playr">
        <span class="gp-icon"></span>
        Descargar en Google Play
      </a>
    </div>
  </div>

  <!-- Enlace inteligente para compartir por WhatsApp/redes: un solo link que
       manda a cada quien a su tienda según el celular (pedido explícito del
       dueño del producto, 2026-09-29). Sin librería externa -- solo mira el
       user-agent, que alcanza de sobra para distinguir iOS de Android. Un
       computador (ninguno de los dos regex) se queda en esta página con las
       dos opciones a mano, en vez de adivinar mal. -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var APPLE_URL = 'https://apps.apple.com/co/app/playr/id6807193893';
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.laruedev.playr';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /Android/.test(ua);

      // Contenido puntual (2026-09-29, pedido explícito del dueño del
      // producto): "compartir mi perfil", "invitar a un partido" y
      // "compartir torneo" ya no mandan un link playr:// suelto (que en
      // WhatsApp/redes llega como texto plano, sin poder tocarlo, Y de nada
      // sirve para quien no tiene la app instalada todavía -- ver el
      // comentario que dejó quien lo construyó en StatsShareCard.tsx). Ahora
      // mandan ESTE link (https, sí es tocable) con ?to=&id=, que intenta
      // abrir la app en el contenido exacto y si no puede -- no está
      // instalada -- cae a la tienda que corresponda.
      var params = new URLSearchParams(window.location.search);
      var to = params.get('to');
      var id = params.get('id');
      // "host/path" tal como los espera el linking de la app (playr://user/:id,
      // playr://game/:gameId, playr://tournament/:tournamentId -- ver App.tsx).
      var path = (to === 'game' || to === 'user' || to === 'tournament') && id
        ? to + '/' + encodeURIComponent(id)
        : '';

      function showFallback() {
        document.getElementById('fallback').className = 'badges fallback show';
      }
      function goToStore() {
        if (isIOS) window.location.replace(APPLE_URL);
        else if (isAndroid) window.location.replace(PLAY_URL);
        else showFallback();
      }

      document.getElementById('debug').textContent = 'to=' + to + ' id=' + id + ' path=' + path + ' isAndroid=' + isAndroid + ' isIOS=' + isIOS;
      if (isAndroid) {
        // Bug real (2026-09-29, encontrado probando en un teléfono real):
        // Chrome/Android NO conserva la ruta al navegar a un esquema propio
        // (playr://user/id) desde JavaScript -- le llega a la app como
        // "playr:///" vacío (confirmado comparando el intent real que
        // recibe la app: "dat=playr:///..." por Chrome vs. "dat=playr://user/..."
        // al abrir el mismo link directo por fuera del navegador). La forma
        // que SÍ funciona en cualquier navegador basado en Chromium
        // (Chrome/Samsung Internet/Brave/Edge, que cubre el navegador
        // interno de WhatsApp en Android) es el esquema intent:// -- y de
        // paso trae el "si no está instalada, ve a la tienda" integrado
        // (browser_fallback_url), sin necesitar el respaldo por tiempo de
        // espera que sí hace falta en iOS.
        var androidIntentUrl = 'intent://' + path + '#Intent;scheme=playr;package=com.laruedev.playr;S.browser_fallback_url='
          + encodeURIComponent(PLAY_URL) + ';end';
        document.getElementById('debug').textContent += ' | ' + androidIntentUrl;
        setTimeout(function () { window.location.href = androidIntentUrl; }, 12000);
        // Aun así, un respaldo final por si el navegador no soporta intent://.
        setTimeout(showFallback, 14500);
      } else if (isIOS) {
        // En iOS no existe intent:// -- se intenta el esquema propio directo.
        // Sin forma confiable de saber si abrió: si la pestaña sigue visible
        // pasado el tiempo de espera, se asume que no está instalada.
        window.location.href = path ? 'playr://' + path : 'playr://';
        var appOpened = false;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) appOpened = true;
        });
        setTimeout(function () {
          if (!appOpened) goToStore();
        }, 1500);
      } else {
        showFallback();
      }
      // Respaldo final: si por lo que sea nada de lo de arriba disparó nada
      // (navegador raro), a los 3 s se muestran igual las dos opciones en
      // vez de dejar el spinner girando para siempre.
      setTimeout(showFallback, 3000);
    })();
  </script>
</body>
</html>
